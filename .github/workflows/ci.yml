name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read, pull-requests: read }   # gitleaks-action lists the PR commits
jobs:
  web:
    runs-on: ubuntu-24.04  # pinned: playwright --with-deps needs 24.04 package names
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end + responsive tests (Chromium, WebKit/iPhone)
        run: |
          npx playwright install --with-deps chromium webkit
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-and-screenshots
          retention-days: 14
          path: |
            playwright-report
            test-results/shots

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations twice (must be idempotent) and run RLS/RPC tests
        run: |
          psql -v ON_ERROR_STOP=1 -q -f tests/sql/00_supabase_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          for t in tests/sql/[1-9]*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$t" 2>&1 | tee -a sql-test.log; test "${PIPESTATUS[0]}" -eq 0; done
          echo "passed checks: $(grep -c 'ok -' sql-test.log)"
