name: Deploy web (Cloudflare Pages)
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, deployments: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env: { HAS_CF: "${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
      - name: Deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=talabat-fire-safety --branch=main
      - name: Skipped
        if: env.HAS_CF != 'true'
        run: echo "CLOUDFLARE_API_TOKEN not set — skipping deploy (see docs/DEPLOYMENT_GUIDE.md)."
